; PHP settings for the web notepad.
; file_uploads stays off on purpose: attachments are sent as the raw request body, not multipart.
; post_max_size must be a bit larger than MAX_FILE_SIZE_MB; it comes from the PHP_POST_MAX_SIZE env var.
expose_php = Off
file_uploads = Off
post_max_size = ${PHP_POST_MAX_SIZE}
session.upload_progress.enabled = Off
