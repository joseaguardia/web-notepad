# Web notepad routes (same rules as .htaccess):
#   /<note>                   -> index.php?note=<note>
#   PUT/POST /<note>/<file>   -> index.php?note=<note>&upload=<file>
#   GET/HEAD /<note>/<file>   -> index.php?note=<note>&file=<file>
ServerName localhost
ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
    RewriteEngine On
    RewriteRule ^([a-zA-Z0-9_-]+)$ index.php?note=$1 [QSA,L]
    RewriteCond %{REQUEST_METHOD} ^(PUT|POST)$
    RewriteRule ^([a-zA-Z0-9_-]+)/([^/]+)$ index.php?note=$1&upload=$2 [B,QSA,L]
    RewriteCond %{REQUEST_METHOD} ^(GET|HEAD)$
    RewriteRule ^([a-zA-Z0-9_-]+)/([^/]+)$ index.php?note=$1&file=$2 [B,QSA,L]
</Directory>

Header always set X-Robots-Tag "noindex, nofollow"
